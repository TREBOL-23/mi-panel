<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Mi Panel</h1>

    <div id="loginBox">

        <h2>Iniciar sesión</h2>

        <label>Correo</label>
        <input
            type="email"
            id="email"
            placeholder="tu@email.com"
        >

        <label>Contraseña</label>
        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button onclick="iniciarSesion()">
            INICIAR SESIÓN
        </button>

        <button onclick="registrarse()">
            CREAR CUENTA
        </button>

        <div id="authResultado"></div>

    </div>


    <div id="panelUsuario" style="display: none;">

        <h2>Mi cuenta</h2>

        <p>
            Usuario:
            <strong id="usuarioEmail"></strong>
        </p>

        <p>
            💰 Saldo:
            <strong>$<span id="saldo">0.00</span></strong>
        </p>
<button onclick="mostrarRecarga()">
    💰 AGREGAR SALDO
</button>

<div id="recargaBox" style="display: none;">

    <h3>Agregar saldo</h3>

    <p>
        Selecciona el monto que deseas agregar:
    </p>

    <button onclick="mostrarTransferencia(5)">
        $5
    </button>

    <button onclick="mostrarTransferencia(10)">
        $10
    </button>

    <button onclick="mostrarTransferencia(20)">
        $20
    </button>

    <button onclick="mostrarTransferencia(50)">
        $50
    </button>

    <div id="transferenciaBox" style="display: none;">

        <h3>Transferencia bancaria</h3>

        <p>
            Monto seleccionado:
            <strong>$<span id="montoTransferencia">0.00</span></strong>
        </p>

        <p>
            Realiza la transferencia utilizando los datos bancarios
            que aparecen en tu panel.
        </p>

        <p>
            <strong>Concepto:</strong> recarga de saldo
        </p>

        <button onclick="crearSolicitudRecarga()">
            YA REALICÉ LA TRANSFERENCIA
        </button>

        <div id="recargaResultado"></div>

    </div>

</div>
        <button onclick="cerrarSesion()">
            CERRAR SESIÓN
        </button>

        <hr>

        <!-- Aquí va Agregar saldo -->

            <label>Servicio</label>

            <select id="servicio">
                <option value="">Cargando servicios...</option>
            </select>

            <label>Enlace</label>

            <input
                type="url"
                id="enlace"
                placeholder="https://instagram.com/usuario"
            >

            <label>Cantidad</label>

            <input
                type="number"
                id="cantidad"
                placeholder="1000"
                min="1"
            >

            <button onclick="realizarOrden()">
                REALIZAR ORDEN
            </button>

            <div id="resultado"></div>

        </div>

    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
